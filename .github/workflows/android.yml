name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        id: build_all
        continue-on-error: true
        run: ./gradlew assembleDebug assembleBeta assembleRelease --stacktrace --continue 2>&1 | tee /tmp/build_error.log

      - name: Commit build error log for diagnosis
        if: steps.build_all.outcome == 'failure' && !startsWith(github.ref, 'refs/tags/')
        run: |
          set +e
          mkdir -p .ci-debug
          tail -n 250 /tmp/build_error.log > .ci-debug/last_build_error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-debug/last_build_error.log
          git commit -m "ci: capture build error log [skip ci]"
          git push --force origin HEAD:main

      - name: Fail if build failed
        if: steps.build_all.outcome == 'failure'
        run: exit 1

      - name: Diagnose APK output (always runs)
        run: |
          set +e
          mkdir -p .ci-debug
          {
            echo "=== find app/build -name '*.apk' ==="
            find app/build -name "*.apk" 2>&1
            echo "=== app/build/outputs tree ==="
            find app/build/outputs -maxdepth 4 2>&1
            echo "=== full build_error.log line count ===" 
            wc -l /tmp/build_error.log
            echo "=== first 150 lines (where the actual error usually is) ===" 
            head -n 150 /tmp/build_error.log 2>&1
            echo "=== lines containing Exception/Caused by/error ===" 
            grep -n -iE "Exception|Caused by|error|FAILURE" /tmp/build_error.log | head -n 40
          } > .ci-debug/apk_diagnosis2.log 2>&1
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "Tag-triggered run: skipping diagnosis commit/push to main to avoid clobbering it."
            exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-debug/apk_diagnosis2.log
          git commit -m "ci: capture apk diagnosis 2 [skip ci]"
          git push --force origin HEAD:main

      - name: Upload Debug APK (Phone)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-debug-apk
          path: app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK (Android TV)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-arm-androidtv-debug-apk
          path: app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK (Phone)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-release-unsigned-apk
          path: app/build/outputs/apk/phone/release/*.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK (Android TV)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-arm-androidtv-release-unsigned-apk
          path: app/build/outputs/apk/tv/release/*.apk
          if-no-files-found: warn

      - name: Upload Beta APK (Phone)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-beta-apk
          path: app/build/outputs/apk/phone/beta/*.apk
          if-no-files-found: warn

      - name: Upload Beta APK (Android TV)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-arm-androidtv-beta-apk
          path: app/build/outputs/apk/tv/beta/*.apk
          if-no-files-found: warn

      - name: Sign Release APK (Phone)
        if: startsWith(github.ref, 'refs/tags/')
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app_phone
        continue-on-error: true
        with:
          releaseDirectory: app/build/outputs/apk/phone/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Sign Release APK (Android TV)
        if: startsWith(github.ref, 'refs/tags/')
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app_tv
        continue-on-error: true
        with:
          releaseDirectory: app/build/outputs/apk/tv/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename Signed APKs with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set +e
          TAG=${GITHUB_REF_NAME}
          if [ -n "${{ steps.sign_app_phone.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app_phone.outputs.signedReleaseFile }}" "PocketCosmosLevi-${TAG}-release.apk"
            echo "Phone signed APK renamed to PocketCosmosLevi-${TAG}-release.apk"
          else
            echo "Phone signing did not produce an output (likely missing signing secrets); skipping."
          fi
          if [ -n "${{ steps.sign_app_tv.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app_tv.outputs.signedReleaseFile }}" "PocketCosmosLevi-arm-androidtv-${TAG}-release.apk"
            echo "TV signed APK renamed to PocketCosmosLevi-arm-androidtv-${TAG}-release.apk"
          else
            echo "TV signing did not produce an output (likely missing signing secrets); skipping."
          fi

      - name: Upload Signed APK Artifact (Phone)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-${{ github.ref_name }}-release.apk
          path: PocketCosmosLevi-${{ github.ref_name }}-release.apk
          if-no-files-found: warn

      - name: Upload Signed APK Artifact (Android TV)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PocketCosmosLevi-arm-androidtv-${{ github.ref_name }}-release.apk
          path: PocketCosmosLevi-arm-androidtv-${{ github.ref_name }}-release.apk
          if-no-files-found: warn

      - name: Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            PocketCosmosLevi-${{ github.ref_name }}-release.apk
            PocketCosmosLevi-arm-androidtv-${{ github.ref_name }}-release.apk
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/tv/debug/*.apk
            app/build/outputs/apk/phone/release/*.apk
            app/build/outputs/apk/tv/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PocketCosmosLevi-${{ github.ref_name }}-release.apk"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping Discord notification."
            exit 0
          fi

          EMBED_TITLE="🚀 PocketCosmosLevi Update!"
          EMBED_DESC="A new version of **PocketCosmosLevi** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://avatars.githubusercontent.com/u/240574984?s=200&v=4'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"📦 Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔗 Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"
